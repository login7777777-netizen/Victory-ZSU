.bar span{display:flex;justify-content:space-between}

.shells{display:flex;gap:3px}

.k{font-size:12px;white-space:nowrap}

.k.low{color:var(--alert)}

.card{max-width:560px;width:100%;display:grid;gap:14px;margin:auto}
.flag{height:6px;background:linear-gradient(var(--flag-b) 50%,var(--flag-y) 50%);width:64px}

.keys b{color:var(--ink);font-weight:500}
.btn{justify-self:start;font-family:var(--display);font-size:18px;background:var(--flag-y);color:#14160c;border:0;padding:12px 26px;cursor:pointer;letter-spacing:.03em}

.stats{display:flex;gap:22px;flex-wrap:wrap;font-size:12px;color:var(--muted)}

#mute{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:10px;pointer-events:auto;font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:4px 8px;cursor:pointer}

@media (max-width:560px){#vitals{width:132px}#route{display:none}#det{width:92px}#det canvas{width:70px;height:70px}}
@media (prefers-reduced-motion:reduce){#msg{transition:none}}
.lang{display:flex;gap:6px}.lang button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:4px 9px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}.lang button[aria-pressed="true"]{background:var(--ink);color:#14160c;border-color:var(--ink)}.lang button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card.menu{max-width:900px;padding-top:36px;grid-template-columns:clamp(116px,30vw,270px) minmax(0,1fr);column-gap:32px;align-items:start}
.card.menu>*{grid-column:2}
.card.menu>.hero{grid-column:1;grid-row:1/span 9;margin:0;align-self:stretch;border:1px solid var(--line);overflow:hidden;min-height:340px}
.hero svg{display:block;width:100%;height:100%;min-height:340px}

.card .story{border-left:3px solid var(--flag-y);padding-left:12px;color:var(--ink)}
.lang{position:absolute;top:12px;right:max(16px,env(safe-area-inset-right,0px))}
.chip{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);border-top:1px solid var(--line);padding-top:5px}
#scoreBox{display:flex;align-items:baseline;gap:6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px}
#scoreV{font-family:var(--display);font-weight:400;font-size:20px;color:var(--ink);margin-left:auto;letter-spacing:.01em;font-variant-numeric:tabular-nums}
#comboV{color:var(--flag-y);font-style:normal;min-width:3.2em;text-align:right}
h1.bad{color:#e4121c;text-shadow:0 0 18px rgba(228,18,28,.45),0 2px 0 #7a0a10}

body.fin #touch{display:none}

#timerBox{display:flex;align-items:baseline;gap:6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#tmrV{margin-left:auto;font-family:var(--display);font-weight:400;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ok)}

function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:.8;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    buzzA=AC.createOscillator();buzzA.type='sawtooth';buzzB=AC.createOscillator();buzzB.type='square';
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;
    buzzG=AC.createGain();buzzG.gain.value=0;
    buzzA.connect(lp);buzzB.connect(lp);lp.connect(buzzG);
    if(AC.createStereoPanner){buzzP=AC.createStereoPanner();buzzG.connect(buzzP);buzzP.connect(master)}else buzzG.connect(master);
    buzzA.start();buzzB.start();
    const as=AC.createBufferSource();as.buffer=noiseBuf;as.loop=true;ambF=AC.createBiquadFilter();ambF.type='bandpass';ambF.frequency.value=2200;ambF.Q.value=.4;ambG=AC.createGain();ambG.gain.value=0;as.connect(ambF);ambF.connect(ambG);ambG.connect(master);as.start();
  }catch(e){AC=null}
}
function noise(dur,freq,vol,type,q,delay){
  if(!AC)return;const t=AC.currentTime+(delay||0);
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(Math.max(60,freq*.25),t+dur);f.Q.value=q||1;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.05);
}
function tone(freq,dur,vol,type,to,delay){
  if(!AC)return;const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
}

function pollPad(){
  let pad=null;
  try{const l=navigator.getGamepads?navigator.getGamepads():[];for(const g of l){if(g&&g.connected){pad=g;break}}}catch(e){}
  if(!pad){if(GP.on&&!pad){GP.on=false}return}
  if(!GP.on){GP.on=true}
  const b=i=>pad.buttons[i]&&(pad.buttons[i].pressed||pad.buttons[i].value>.5);
  let lx=pad.axes[0]||0,ly=pad.axes[1]||0;
  const lm=Math.hypot(lx,ly);if(lm<.2){lx=ly=0}else{const s=(lm-.2)/.8/lm;lx*=s;ly*=s}
  if(b(14))lx=-1;if(b(15))lx=1;if(b(12))ly=-1;if(b(13))ly=1;
  GP.mx=lx;GP.my=ly;
  let rx=pad.axes[2]||0,ry=pad.axes[3]||0;const rm=Math.hypot(rx,ry);
  if(rm>.3){GP.ax=rx/rm;GP.ay=ry/rm;GP.aim=true;aimSrc='pad'}else GP.aim=false;
  GP.fire=b(7)||b(5);GP.run=b(6)||b(4)||b(10);
  const now={r:b(2),h:b(3),e:b(1),a:b(0),s:b(9)};
  if(now.r&&!GP.prev.r)startReload();
  if(now.h&&!GP.prev.h)useHeal();
  if(now.e&&!GP.prev.e)useFood();
  if(now.s&&!GP.prev.s){if(G.state==='play'||G.state==='pause')togglePause();else if(G.state!=='finale')startGame()}
  if(now.a&&!GP.prev.a&&G.state!=='play'&&G.state!=='pause'&&G.state!=='finale')startGame();
  GP.prev=now;
}

let WD=null;
function sortY(a){a.sort((p,q)=>p.y-q.y)}
function lo(arr,y){let a=0,b=arr.length;while(a<b){const m=(a+b)>>1;if(arr[m].y<y)a=m+1;else b=m}return a}
function blocked(w,x,y,r){
  for(const t of w.trees){if(Math.abs(t.y-y)<60&&Math.hypot(t.x-x,t.y-y)<t.r*.5+r+4)return true}
  for(const q of w.walls){if(x>q.x-r&&x<q.x+q.w+r&&y>q.y-r&&y<q.y+q.h+r)return true}
  return false;
}
function gen(seed){
  R=mulberry(seed);
  const w={trees:[],walls:[],craters:[],mines:[],crates:[],waiters:[],decor:[],roads:[]};
  const END=GOAL_Y+160;
  function rectOk(x,y,ww,hh,pad){
    if(x<4||x+ww>W-4)return false;
    for(let i=w.walls.length-1;i>=Math.max(0,w.walls.length-14);i--){const q=w.walls[i];
      if(x<q.x+q.w+pad&&x+ww>q.x-pad&&y<q.y+q.h+pad&&y+hh>q.y-pad)return false}
    return true;
  }
  function addWall(kind,x,y,ww,hh,pad){if(rectOk(x,y,ww,hh,pad)){w.walls.push({kind,x,y,w:ww,h:hh,seed:R()});return true}return false}
  for(let y=-140;y>END;y-=40){
    const m=-y/PX,b=biomeAt(m),near=m<35;
    for(let i=0;i<(b===3?1:5);i++)w.decor.push({k:'g',x:rnd(0,W),y:y+rnd(0,40)});
    if(b===0){
      const n=R()<.55?2:1;
      if(!near)for(let i=0;i<n;i++)w.trees.push({x:rnd(30,W-30),y:y+rnd(0,40),r:rnd(15,26),s:R()});
      if(R()<.9)w.trees.push({x:rnd(2,26),y:y+rnd(0,40),r:rnd(18,26),s:R()});
      if(R()<.9)w.trees.push({x:rnd(W-26,W-2),y:y+rnd(0,40),r:rnd(18,26),s:R()});
      if(R()<.14)w.craters.push({x:rnd(40,W-40),y:y+rnd(0,40),r:rnd(12,22)});
    }
    if(b===1){
      for(let i=0;i<3;i++)w.decor.push({k:'f',x:Math.round(rnd(0,W)/26)*26,y:y+rnd(0,40),l:rnd(40,90)});
      if(R()<.08)w.trees.push({x:rnd(30,W-30),y:y+rnd(0,40),r:rnd(14,22),s:R()});
      if(R()<.5){w.trees.push({x:rnd(2,22),y:y+rnd(0,40),r:rnd(14,20),s:R()})}
      if(R()<.5){w.trees.push({x:rnd(W-22,W-2),y:y+rnd(0,40),r:rnd(14,20),s:R()})}
      if(R()<.13)w.craters.push({x:rnd(30,W-30),y:y+rnd(0,40),r:rnd(14,30)});
      if(R()<.025)addWall('wreck',rnd(40,W-90),y,44,24,60);
    }
    if(b===2){
      for(let i=0;i<3;i++)w.decor.push({k:'r',x:rnd(0,W),y:y+rnd(0,40)});
      if(R()<.12){const ww=rnd(60,110),hh=rnd(50,90);addWall('house',rnd(10,W-ww-10),y,ww,hh,70)}
      if(R()<.07)addWall('fence',rnd(10,W-110),y,rnd(60,100),6,40);
      if(R()<.05)w.trees.push({x:rnd(20,W-20),y:y+rnd(0,40),r:rnd(12,18),s:R()});
      if(R()<.06)w.craters.push({x:rnd(30,W-30),y:y+rnd(0,40),r:rnd(12,24)});
    }
    if(b===3){
      for(let i=0;i<2;i++)w.decor.push({k:'r',x:rnd(0,W),y:y+rnd(0,40)});
      if(R()<.16){const ww=rnd(80,140),hh=rnd(80,150);const left=R()<.5;addWall('block',left?rnd(0,150-ww+60):rnd(W-150-60,W-ww),y,ww,hh,50)}
      if(R()<.07)addWall('barrier',rnd(60,W-120),y,rnd(46,80),14,50);
      if(R()<.05)addWall('car',rnd(60,W-100),y,40,22,50);
      if(R()<.05)w.craters.push({x:rnd(30,W-30),y:y+rnd(0,40),r:rnd(10,18)});
    }
    const pm=[.04,.24,.18,.11][b];
    if(!near&&R()<pm){const x=rnd(24,W-24),yy=y+rnd(0,40);w.mines.push({x,y:yy,on:true,seed:R()})}
    if(b===1&&!near&&R()<.1){const x=rnd(24,W-24),yy=y+rnd(0,40);w.mines.push({x,y:yy,on:true,seed:R()})}
  }
  for(let m=1450;m<2250;m+=200)w.roads.push({y:-m*PX-1600,h:1600,x:210,w:110,k:'dirt'});
  for(let y=-1450*PX;y>-3000*PX;y-=70)if(-y/PX>2250)w.decor.push({k:'d',x:W/2,y});
  w.mines=w.mines.filter(q=>!blocked(w,q.x,q.y,14));
  let m=40,first=true;
  const mk=(type,mm)=>{let x,y=-mm*PX,t=0;do{x=rnd(40,W-40);t++}while(blocked(w,x,y,16)&&t<20);w.crates.push({x,y,type,got:false})};
  mk('ammo',40);mk('food',95);
  m=140;
  while(m<2960){
    const r=R(),type=r<.42?'ammo':r<.68?'food':'heal';
    mk(type,m);m+=rnd(110,175);
  }
  mk('heal',2900);

    w.waiters.push({x,y,det:R()<.4});
  }
  ['trees','walls','craters','mines','crates','decor','waiters'].forEach(k=>sortY(w[k]));
  return w;
}

  const act=new Set();
  for(let i=0;i<Math.min(4,list.length);i++){
    const d=list[i].d,dist=list[i].dist;act.add(d);
    let v=VOICES.get(d);if(!v){v=makeVoice();VOICES.set(d,v)}
    if(dist>640){v.vg.gain.setTargetAtTime(0,t,.1);continue}
    const near=clamp(1-dist/540,0,1);
    const vr=((d.x-P.x)*Math.cos(d.a)+(d.y-P.y)*Math.sin(d.a))/Math.max(dist,1)*d.spd;
    const dop=1100/(1100+vr);
    v.jit+=(rr()-.5)*.1;v.jit*=.95;
    const dive=d.mode==='hunt'?Math.pow(clamp((2.2-dist/Math.max(d.spd,1))/2.2,0,1),1.4):0;
    const f0=((d.mode==='search'?300:380)+d.spd*.55)*(1+v.jit*.05)*dop*(1+.5*dive);
    for(let k=0;k<4;k++)v.o[k].frequency.setTargetAtTime(f0*(1+(MOT[k]-1)*(1+3*dive)),t,.03);
    const vol=Math.pow(near,1.5)*.2*(1+clamp((170-dist)/170,0,1)*.9)*(1-.5*WX.rain)*(1+.15*TD.d)*(d.mode==='search'?.8:1)*(1+.35*dive);
    v.vg.gain.setTargetAtTime(vol,t,.05);
    v.lp.frequency.setTargetAtTime(lerp(650,7500,Math.pow(near,1.3))*(1-.35*WX.rain)*(1+.5*dive),t,.06);
    v.ng.gain.setTargetAtTime(.25+near*.5+.5*dive,t,.1);
    v.nf.frequency.setTargetAtTime(1800+d.spd*5,t,.1);
    if(v.pan)v.pan.pan.setTargetAtTime(clamp((d.x-P.x)/180,-1,1),t,.05);
  }
  for(const e of VOICES){if(!act.has(e[0])){killVoice(e[1]);VOICES.delete(e[0])}}
}

/* ---------- weather ---------- */
const WPROF={clear:{rain:0,snow:0,fog:0,dark:0,wind:0},rain:{rain:.75,snow:0,fog:.15,dark:.16,wind:.2},storm:{rain:1,snow:0,fog:.28,dark:.32,wind:.5},fog:{rain:0,snow:0,fog:1,dark:.05,wind:0},snow:{rain:0,snow:.75,fog:.15,dark:.04,wind:.1},blizzard:{rain:0,snow:1,fog:.55,dark:.08,wind:1}};
function pickWeather(prev){
  const tbl={summer:[['clear',.45],['rain',.25],['storm',.15],['fog',.15]],autumn:[['clear',.3],['rain',.35],['fog',.25],['storm',.1]],winter:[['clear',.3],['snow',.35],['blizzard',.15],['fog',.2]]}[SEASON];
  for(let n=0;n<8;n++){const r=rr();let acc=0;for(const e of tbl){acc+=e[1];if(r<acc){if(e[0]!==prev||n>6)return e[0];break}}}
  return 'clear';
}
function computeWX(){const p=WPROF[Wst.cur],q=WPROF[Wst.prev||Wst.cur];for(const k in WX)WX[k]=lerp(q[k]||0,p[k]||0,Wst.mix)}
function initWeather(){Wst={cur:pickWeather(null),prev:null,mix:1,t:rr2(45,90),flash:0,thunderT:0,lt:rr2(4,10)};computeWX()}
function updBiomeText(){if(!Wst)return;$('biome').textContent=bname(Math.max(0,lastBiome))+' · '+tr('s'+SEASON)+' · '+tr('w'+Wst.cur)+' · '+tr('t'+TD.label)}
function updateWeather(dt){
  Wst.t-=dt;
  if(Wst.t<=0){Wst.prev=Wst.cur;Wst.cur=pickWeather(Wst.cur);Wst.mix=0;Wst.t=rr2(45,90);showMsg(tr('wm'+Wst.cur),2.4);updBiomeText()}
  if(Wst.mix<1)Wst.mix=Math.min(1,Wst.mix+dt/6);
  computeWX();
  if(Wst.cur==='storm'&&Wst.mix>.5){Wst.lt-=dt;if(Wst.lt<=0){Wst.lt=rr2(4,11);Wst.flash=1;Wst.thunderT=rr2(.3,1.6)}}
  if(Wst.flash>0)Wst.flash=Math.max(0,Wst.flash-dt*3);
  if(Wst.thunderT>0){Wst.thunderT-=dt;if(Wst.thunderT<=0){SFX.thunder();shake=Math.min(14,shake+3)}}
}

/* ---------- time of day + cover ---------- */
function computeTOD(){
  const p=G.tod,ss=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
  let dk=0;
  if(p<.4)dk=0;else if(p<.6)dk=ss(.4,.6,p)*.55;else if(p<.7)dk=lerp(.55,.9,(p-.6)/.1);else if(p<.85)dk=.9;else dk=lerp(.9,0,(p-.85)/.15);
  TD.d=dk;
  TD.warm=p>=.38&&p<.68?Math.sin(Math.PI*clamp((p-.38)/.3,0,1))*.9:p>=.85?Math.sin(Math.PI*clamp((p-.85)/.15,0,1))*.6:0;
  TD.label=p<.4?'day':p<.6?'dusk':p<.85?'night':'dawn';
}
function updateCover(dt){
  let tgt=0;
  if(Math.hypot(P.vx,P.vy)<75&&P.exposed<=0&&!P.sprinting){
    const T=WD.trees;
    for(let i=lo(T,P.y-40);i<T.length&&T[i].y<P.y+40;i++){const t=T[i];if(Math.hypot(t.x-P.x,t.y-P.y)<t.r*.95)tgt=Math.max(tgt,clamp(t.r/24,.6,1))}
    tgt=Math.min(1,tgt*({summer:1,autumn:.8,winter:.35}[SEASON])*(1+.3*TD.d));
  }
  if(tgt>0)P.coverT=Math.min(1,(P.coverT||0)+dt);else P.coverT=0;
  P.cover=tgt*P.coverT;
}

/* ---------- score ---------- */
function addScore(base,key,x,y,flat){
  let mult=1,pts;
  if(flat){pts=base}else{
    const env=1+.3*TD.d+.15*WX.fog+.1*(WX.rain+WX.snow);
    mult=(1+Math.min(1.5,.25*G.combo))*env;pts=Math.round(base*mult);G.combo++;G.comboT=8;
  }
  G.score+=pts;
  popups.push({x,y,t:0,text:'+'+pts+' '+tr(key)+(!flat&&mult>1.01?' \u00d7'+mult.toFixed(1):'')});
}
function saveScore(){if(G.score>G.bs){G.bs=G.score;try{localStorage.setItem('dkm_bs',String(G.bs))}catch(e){}}}

/* ---------- finale ---------- */
function stepParts(dt){
  const damp=Math.pow(.94,dt*60);
  for(const q of parts){q.life-=dt;q.vy+=(q.g||0)*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=damp;q.vy*=damp}
  parts=parts.filter(q=>q.life>0);
}
function firework(x,y){
  const cols=['#4a8cff','#ffd23a','#ffffff'],c1=cols[Math.floor(rr()*2)],c2=cols[rr()<.5?2:Math.floor(rr()*2)];
  const n=48,sp=rr2(70,130);
  for(let i=0;i<n;i++){const a=i/n*TAU,v=sp*(i%2?1:.62);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rr2(1.1,1.6),max:1.6,c:i%2?c1:c2,s:2.8,g:60,add:true})}
  booms.push({x,y,r:34,t:0,dur:.35,big:false,fw:true});SFX.fw();
}
function initFinale(){
  G.fT=0;G.fMsg=0;G.fw=0;G.art=0;
  for(const d of drones)boom(d.x,d.y,22,false);
  drones=[];pellets=[];
  Wst.prev=Wst.cur;Wst.cur='clear';Wst.mix=0;Wst.flash=0;
  G.TD0={d:TD.d,warm:TD.warm};
  P.vx=P.vy=0;P.cover=0;
  G.friends=[];
  for(let i=0;i<6;i++){const s=i<3?-1:1,k=i%3;G.friends.push({x:W/2-60+i*24+rr2(-8,8),y:GOAL_Y-90-rr2(0,30),tx:W/2+s*(34+k*28),ty:GOAL_Y+4+(k%2)*12,delay:.7+i*.22,face:Math.PI/2,ph:rr()*6,run:false})}
  document.body.classList.add('fin');SFX.fanfare();
}
function finaleStep(dt){
  G.fT+=dt;const T=G.fT;
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').classList.remove('show')}
  const seq=[[.3,'fin1'],[2.8,'fin2'],[5.4,G.end==='A'?'fin3':G.end==='B'?'fin3b':'fin3c'],[8.4,G.end==='C'?'fin4c':'fin4']];
  while(G.fMsg<seq.length&&T>=seq[G.fMsg][0]){showMsg(tr(seq[G.fMsg][1]),2.6);G.fMsg++}
  const dx=W/2-P.x,dy=GOAL_Y+10-P.y,dd=Math.hypot(dx,dy);
  if(dd>2){const s=Math.min(dd/dt,62);P.vx=dx/dd*s;P.vy=dy/dd*s;P.x+=P.vx*dt;P.y+=P.vy*dt}else{P.vx=P.vy=0}
  P.face+=angDiff(P.face,-Math.PI/2)*Math.min(1,dt*6);P.step+=Math.hypot(P.vx,P.vy)*dt*.11;P.recoil=0;
  if(P.hurt>0)P.hurt-=dt;
  for(const f of G.friends){
    if(T<f.delay)continue;
    const ex=f.tx-f.x,ey=f.ty-f.y,ed=Math.hypot(ex,ey);
    if(ed>3){const s=Math.min(ed/dt,95);f.x+=ex/ed*s*dt;f.y+=ey/ed*s*dt;f.face=Math.atan2(ey,ex);f.run=true}
    else{f.run=false;f.face+=angDiff(f.face,Math.atan2(P.y-f.y,P.x-f.x))*Math.min(1,dt*5)}
  }
  Wst.mix=Math.min(1,Wst.mix+dt/4);computeWX();
  const k=clamp(T/4,0,1);TD.d=lerp(G.TD0.d,0,k);TD.warm=lerp(G.TD0.warm,.85,k);
  if(T>3&&T<8.5){G.art-=dt;if(G.art<=0){G.art=({A:rr2(.45,.9),B:rr2(.9,1.5),C:rr2(1.7,2.5)}[G.end]);boom(rr2(40,W-40),GOAL_Y-rr2(95,190),rr2(34,52),true,.4);shake=Math.min(6,shake+2)}}
  if(G.end!=='C'&&T>(G.end==='A'?5.5:6.5)){G.fw-=dt;if(G.fw<=0){G.fw=(T<10?rr2(.35,.7):rr2(.9,1.6))*(G.end==='B'?1.8:1);firework(rr2(60,W-60),P.y-rr2(130,250))}}
  stepParts(dt);
  for(const b of booms)b.t+=dt;booms=booms.filter(b=>b.t<b.dur);
  shake*=Math.exp(-8*dt);if(flashA>0)flashA=Math.max(0,flashA-dt*1.6);
  if(T>=11&&G.state==='finale'){G.state='win';renderCard('win')}
}

  $('scoreV').textContent=G.score;const cmb=1+Math.min(1.5,.25*G.combo);$('comboV').textContent=G.combo>0&&G.state==='play'?'\u00d7'+cmb.toFixed(2).replace(/0$/,''):'';
  const tk=G.time<360?'tmr1':G.time<540?'tmr2':'tmr3',tl=G.time<360?360-G.time:G.time<540?540-G.time:0,tv=$('tmrV');
  $('tmrL').textContent=tr(tk);tv.textContent=G.time<540?fmtTime(Math.ceil(tl)):'\u2014';
  tv.style.color=G.time<300?'var(--ok)':G.time<360?'var(--amber)':'var(--alert)';
  $('det').classList.toggle('on',DET.on);$('detTxt').textContent=DET.on?tr('sig'):tr('quiet');
  drawDet(t);
  const fl=$('flash');fl.style.opacity=clamp(flashA+(P.hp<30&&G.state==='play'?.18+.1*Math.sin(t*6):0),0,1);
}
$('flash').style.background='radial-gradient(ellipse at center,rgba(180,20,10,0) 35%,rgba(180,20,10,.9) 100%)';

/* ---------- screens ---------- */
function fmtTime(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
const HERO='<svg viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice" role="img"><defs><linearGradient id="fw" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".25" stop-color="#000" stop-opacity=".10"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset=".75" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/></linearGradient><radialGradient id="vg" cx=".5" cy=".42" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient><linearGradient id="sk" x1="0" x2="1"><stop offset="0" stop-color="#b98962"/><stop offset=".5" stop-color="#d6a97f"/><stop offset="1" stop-color="#b98962"/></linearGradient></defs><rect width="240" height="150" fill="#2f6fdb"/><rect y="150" width="240" height="150" fill="#f4cb1d"/><rect width="240" height="300" fill="url(#fw)"/><!-- sleeves --><path d="M14 300 L22 238 Q30 204 64 196 L68 300Z" fill="#56632f"/><path d="M226 300 L218 238 Q210 204 176 196 L172 300Z" fill="#56632f"/><path d="M30 238 Q36 218 52 212 L56 232 Q44 236 40 250Z" fill="#46522a" opacity=".6"/><rect x="29" y="231" width="20" height="14" rx="1.5" fill="#2f6fdb" transform="rotate(-8 39 238)"/><rect x="29" y="238" width="20" height="7" fill="#f4cb1d" transform="rotate(-8 39 238)"/><!-- neck --><path d="M102 164 L138 164 L140 200 L100 200Z" fill="#c08f67"/><path d="M98 194 Q120 214 142 194 L146 204 Q120 224 94 204Z" fill="#3d4a2a"/><!-- plate carrier --><path d="M62 198 L96 190 L120 208 L144 190 L178 198 L186 300 L54 300Z" fill="#3b4528"/><path d="M82 192 L100 190 L98 222 L80 222Z" fill="#323b21"/><path d="M158 192 L140 190 L142 222 L160 222Z" fill="#323b21"/><rect x="76" y="218" width="88" height="62" rx="7" fill="#48552f" stroke="#262d18" stroke-width="2"/><g stroke="#000" stroke-opacity=".28" stroke-width="1.4"><path d="M80 228H160M80 236H160M80 244H160M80 252H160M80 260H160M80 268H160"/></g><g fill="#2e371e" stroke="#1d2312" stroke-width="1.5"><rect x="70" y="270" width="26" height="30" rx="3"/><rect x="107" y="270" width="26" height="30" rx="3"/><rect x="144" y="270" width="26" height="30" rx="3"/></g><g fill="#1f2615"><rect x="74" y="266" width="18" height="6"/><rect x="111" y="266" width="18" height="6"/><rect x="148" y="266" width="18" height="6"/></g><rect x="104" y="226" width="32" height="18" rx="2" fill="#2f6fdb"/><rect x="104" y="235" width="32" height="9" fill="#f4cb1d"/><!-- ears + face --><ellipse cx="88" cy="140" rx="5" ry="9" fill="#b98962"/><ellipse cx="152" cy="140" rx="5" ry="9" fill="#b98962"/><path d="M90 120 Q90 176 120 182 Q150 176 150 120Z" fill="url(#sk)"/><path d="M92 150 Q120 190 148 150 L148 166 Q120 192 92 166Z" fill="#6b4c36" opacity=".55"/><path d="M96 134 Q104 128 114 132" stroke="#2c2018" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M144 134 Q136 128 126 132" stroke="#2c2018" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="106" cy="140" rx="4.4" ry="3" fill="#1d1813"/><ellipse cx="134" cy="140" rx="4.4" ry="3" fill="#1d1813"/><path d="M120 142 L116 156 Q120 159 124 156Z" fill="#a67852" opacity=".7"/><path d="M110 165 Q120 169 130 165" stroke="#5a2f26" stroke-width="2.4" fill="none" stroke-linecap="round"/><!-- chin strap --><path d="M90 126 L96 166 Q120 182 144 166 L150 126" stroke="#232919" stroke-width="3" fill="none"/><rect x="114" y="174" width="12" height="7" rx="2" fill="#232919"/><!-- helmet --><path d="M80 130 C76 84 96 62 120 62 C144 62 164 84 160 130 Q120 108 80 130Z" fill="#4d5a31"/><path d="M78 128 Q120 104 162 128 L160 135 Q120 114 80 135Z" fill="#364022"/><g opacity=".55"><ellipse cx="100" cy="86" rx="9" ry="5" fill="#6a7a42" transform="rotate(-20 100 86)"/><ellipse cx="136" cy="78" rx="11" ry="5" fill="#3a4524" transform="rotate(15 136 78)"/><ellipse cx="124" cy="100" rx="9" ry="4" fill="#6a7a42"/><ellipse cx="90" cy="108" rx="7" ry="4" fill="#3a4524"/><ellipse cx="150" cy="104" rx="7" ry="4" fill="#6a7a42"/></g><path d="M104 70 Q120 63 136 70" stroke="#6e7e47" stroke-width="2" fill="none" opacity=".7"/><rect x="111" y="97" width="18" height="11" rx="2" fill="#1f2616"/><rect x="115" y="94" width="10" height="4" rx="1" fill="#2a331c"/><rect x="78" y="100" width="7" height="18" rx="2" fill="#262e18"/><rect x="155" y="100" width="7" height="18" rx="2" fill="#262e18"/><rect width="240" height="300" fill="url(#vg)"/></svg>';
function renderCard(kind){
  const card=$('card'),sc=$('screen');
  const flag='<div class="flag"></div>';
  const lang='<div class="lang"><button type="button" data-lang="uk" aria-pressed="'+(LANG==='uk')+'">УКР</button><button type="button" data-lang="en" aria-pressed="'+(LANG==='en')+'">ENG</button></div>';
  const dm=Math.floor(kind==='win'?GOAL:meters());
  const stats='<div class="stats"><span><b>'+G.score+'</b>'+tr('sScore')+'</span><span><b>'+dm+' '+tr('m')+'</b>'+tr('sDist')+'</span><span><b>'+G.kills+'</b>'+tr('sKills')+'</span><span><b>'+G.shots+'</b>'+tr('sShots')+'</span><span><b>'+fmtTime(G.time)+'</b>'+tr('sTime')+'</span><span><b>'+G.best+' '+tr('m')+'</b>'+tr('sBest')+'</span><span><b>'+G.bs+'</b>'+tr('sBestScore')+'</span></div>';
  let h='';
  if(kind==='menu'){
    h=lang+flag+'<figure class="hero" aria-label="'+tr('heroAlt')+'">'+HERO+'</figure><h1>'+tr('title')+'</h1><p class="story">'+tr('story')+'</p><button class="btn" data-act="start" id="btnGo">'+tr('start')+'</button><p>'+tr('intro')+'</p>'
     +'<div class="keys"><b>'+tr('kbL')+'</b><span>'+tr('kb1')+'</span><b></b><span>'+tr('kb2')+'</span>'
     +'<b>'+tr('padL')+'</b><span>'+tr('pad')+'</span>'
     +'<b>'+tr('phL')+'</b><span>'+tr('ph')+'</span></div>'
     +'<div class="stats"><span>'+tr('tip')+'</span></div>'+(G.bs>0?'<div class="stats"><span>'+tr('bestLine',{n:G.bs})+'</span></div>':'')
     +(GP.on?'<div class="stats"><span>'+tr('padOn')+'</span></div>':'');
  }else if(kind==='dead'){
    h=flag+'<h1 class="bad">'+tr('dead')+'</h1><p>'+(G.cause?tr('cause',{c:tr(G.cause)})+' ':'')+tr('left',{n:Math.max(0,GOAL-Math.floor(meters()))})+' '+tr('lost')+'</p>'+stats+'<button class="btn" data-act="start" id="btnGo">'+tr('again')+'</button>';
  }else if(kind==='win'){
    h=flag+'<h1 class="'+({A:'good',B:'',C:'late'}[G.end]||'good')+'">'+tr('won'+(G.end||'A'))+'</h1><p>'+tr('end'+(G.end||'A'))+' '+tr('bonus',{n:G.bonus})+' '+tr('winp',{hp:Math.ceil(P.hp),a:P.tube+P.reserve})+'</p>'+stats+'<button class="btn" data-act="start" id="btnGo">'+tr('again2')+'</button>';
  }else if(kind==='pause'){
    h=lang+flag+'<h1>'+tr('pause')+'</h1><p>'+tr('pausep')+'</p><button class="btn" data-act="resume" id="btnGo">'+tr('resume')+'</button>';
  }
  sc.style.background=kind==='win'?'rgba(8,10,6,.5)':'';card.className=kind==='menu'?'card menu':'card';card.dataset.kind=kind;card.innerHTML=h;sc.hidden=false;
  const b=$('btnGo');if(b)setTimeout(()=>{try{b.focus({preventScroll:true})}catch(e){}},50);
}
$('card').addEventListener('click',e=>{const lg=e.target.closest('[data-lang]');if(lg){LANG=lg.dataset.lang;try{localStorage.setItem('dkm_lang',LANG)}catch(x){}applyLang();renderCard($('card').dataset.kind||'menu');return}const a=e.target.closest('[data-act]');if(!a)return;initAudio();if(a.dataset.act==='start')startGame();else togglePause()});
function startGame(){
  initAudio();newGame();G.state='play';$('screen').hidden=true;shellKey='';document.body.classList.remove('fin');
  lastBiome=-1;updBiomeText();
}
function togglePause(){
  if(G.state==='play'){G.state='pause';renderCard('pause')}
  else if(G.state==='pause'){G.state='play';$('screen').hidden=true;last=performance.now()}
}

/* ---------- loop ---------- */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,Math.max(0,(ts-last)/1000));last=ts;
  try{
    pollPad();
    if(G.state==='play')update(dt);
    else if(G.state==='finale'||G.state==='win')finaleStep(dt);
    else if(G.state==='dead'){
      stepParts(dt);
      for(const b of booms)b.t+=dt;booms=booms.filter(b=>b.t<b.dur);
      if(flashA>0)flashA=Math.max(0,flashA-dt*1.6);shake*=Math.exp(-8*dt);
    }
    camY=P.y-VH*((G.state==='finale'||G.state==='win')?lerp(.62,.84,clamp(G.fT/3,0,1)):.62);
    render(ts/1000);hud(ts/1000);updateBuzz();
  }catch(err){console.error(err)}
}
resize();newGame();applyLang();renderCard('menu');
requestAnimationFrame(frame);
})();
</script>
